<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boost Your Followers | Instant Growth</title>
  <!-- Google Fonts & FontAwesome Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --primary: #8a2be2;
      --primary-glow: #a855f7;
      --secondary: #00f2fe;
      --bg: #090a0f;
      --card-bg: rgba(255, 255, 255, 0.05);
      --card-border: rgba(255, 255, 255, 0.12);
      --text: #ffffff;
      --text-muted: #a1a1aa;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      position: relative;
    }

    /* Animated Background Glowing Orbs */
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      z-index: -1;
      animation: float 8s infinite alternate ease-in-out;
    }
    .orb-1 {
      width: 350px;
      height: 350px;
      background: rgba(138, 43, 226, 0.35);
      top: -50px;
      left: -50px;
    }
    .orb-2 {
      width: 400px;
      height: 400px;
      background: rgba(0, 242, 254, 0.25);
      bottom: 10%;
      right: -50px;
      animation-delay: -4s;
    }

    @keyframes float {
      0% { transform: translateY(0px) scale(1); }
      100% { transform: translateY(30px) scale(1.1); }
    }

    /* Header Section */
    header {
      text-align: center;
      padding: 60px 20px 30px;
      max-width: 800px;
      animation: fadeInDown 1s ease-out;
    }

    .badge {
      display: inline-block;
      padding: 6px 16px;
      background: linear-gradient(90deg, rgba(138, 43, 226, 0.2), rgba(0, 242, 254, 0.2));
      border: 1px solid var(--primary-glow);
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--secondary);
      letter-spacing: 1px;
      margin-bottom: 15px;
      text-transform: uppercase;
      box-shadow: 0 0 15px rgba(168, 85, 247, 0.3);
    }

    h1 {
      font-size: 2.8rem;
      font-weight: 800;
      line-height: 1.2;
      background: linear-gradient(135deg, #ffffff 30%, var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 15px;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 1.1rem;
    }

    /* Main Container */
    .container {
      width: 100%;
      max-width: 1100px;
      padding: 0 20px 60px;
    }

    /* Package Cards Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 25px;
      margin-top: 30px;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 30px 20px;
      text-align: center;
      position: relative;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      cursor: pointer;
      overflow: hidden;
    }

    .card:hover {
      transform: translateY(-10px);
      border-color: var(--primary-glow);
      box-shadow: 0 10px 30px rgba(138, 43, 226, 0.3);
    }

    .card.selected {
      border: 2px solid var(--secondary);
      background: rgba(0, 242, 254, 0.08);
      box-shadow: 0 0 25px rgba(0, 242, 254, 0.4);
    }

    .card .icon {
      font-size: 2.5rem;
      color: var(--secondary);
      margin-bottom: 15px;
      transition: transform 0.3s ease;
    }

    .card:hover .icon {
      transform: scale(1.15) rotate(5deg);
    }

    .card h3 {
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .card .price {
      font-size: 1.4rem;
      font-weight: 600;
      color: #38ef7d;
      margin-top: 10px;
    }

    .card .free-tag {
      color: #ff416c;
      font-weight: 700;
    }

    .tag-popular {
      position: absolute;
      top: 15px;
      right: -30px;
      background: linear-gradient(45deg, #ff416c, #ff4b2b);
      color: white;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 4px 30px;
      transform: rotate(45deg);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Checkout & Details Section */
    .order-section {
      margin-top: 50px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(16px);
      border-radius: 24px;
      padding: 40px 30px;
      max-width: 650px;
      margin-left: auto;
      margin-right: auto;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      animation: fadeInUp 1s ease-out;
    }

    .order-section h2 {
      font-size: 1.8rem;
      text-align: center;
      margin-bottom: 25px;
    }

    .input-group {
      margin-bottom: 20px;
      position: relative;
    }

    .input-group label {
      display: block;
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .input-group input, .input-group select {
      width: 100%;
      padding: 16px 20px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: border 0.3s ease;
    }

    .input-group input:focus, .input-group select:focus {
      border-color: var(--secondary);
      box-shadow: 0 0 12px rgba(0, 242, 254, 0.3);
    }

    /* Submit Button */
    .btn-submit {
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      border: none;
      border-radius: 12px;
      color: white;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 0 10px 25px rgba(138, 43, 226, 0.4);
    }

    .btn-submit:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 30px rgba(0, 242, 254, 0.5);
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* Alert Message */
    .status-msg {
      margin-top: 15px;
      text-align: center;
      font-weight: 600;
      display: none;
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- Background Orbs -->
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <!-- Header -->
  <header>
    <div class="badge"><i class="fa-solid fa-bolt"></i> Instant Delivery</div>
    <h1>Elevate Your Social Presence</h1>
    <p class="subtitle">Select a package or start with 100 followers completely free!</p>
  </header>

  <!-- Main Content -->
  <div class="container">
    
    <!-- Pricing Cards Grid -->
    <div class="grid">
      <!-- 100 Free -->
      <div class="card selected" onclick="selectPackage('100 Followers (FREE)', '₹0', this)">
        <div class="icon"><i class="fa-solid fa-gift"></i></div>
        <h3>100</h3>
        <p>Followers</p>
        <div class="price free-tag">FREE TRIAL</div>
      </div>

      <!-- 1000 Paid -->
      <div class="card" onclick="selectPackage('1,000 Followers', '₹50', this)">
        <div class="tag-popular">Popular</div>
        <div class="icon"><i class="fa-solid fa-fire"></i></div>
        <h3>1,000</h3>
        <p>Followers</p>
        <div class="price">₹50</div>
      </div>

      <!-- 2000 Paid -->
      <div class="card" onclick="selectPackage('2,000 Followers', '₹100', this)">
        <div class="icon"><i class="fa-solid fa-rocket"></i></div>
        <h3>2,000</h3>
        <p>Followers</p>
        <div class="price">₹100</div>
      </div>

      <!-- 5000 Paid -->
      <div class="card" onclick="selectPackage('5,000 Followers', '₹250', this)">
        <div class="icon"><i class="fa-solid fa-crown"></i></div>
        <h3>5,000</h3>
        <p>Followers</p>
        <div class="price">₹250</div>
      </div>

      <!-- 10000 Paid -->
      <div class="card" onclick="selectPackage('10,000 Followers', '₹500', this)">
        <div class="icon"><i class="fa-solid fa-gem"></i></div>
        <h3>10,000</h3>
        <p>Followers</p>
        <div class="price">₹500</div>
      </div>

      <!-- Custom -->
      <div class="card" onclick="selectPackage('Custom Amount', 'Custom Price', this)">
        <div class="icon"><i class="fa-solid fa-sliders"></i></div>
        <h3>Custom</h3>
        <p>Followers</p>
        <div class="price" style="color: var(--secondary);">Custom Plan</div>
      </div>
    </div>

    <!-- Form Section -->
    <div class="order-section">
      <h2><i class="fa-solid fa-cart-shopping"></i> Complete Your Request</h2>
      
      <form id="orderForm" onsubmit="handleDiscordOrderSubmit(event)">
        <!-- Selected Plan Display -->
        <div class="input-group">
          <label><i class="fa-solid fa-box-open"></i> Selected Package</label>
          <input type="text" id="selectedPlan" value="100 Followers (FREE) - ₹0" readonly style="background: rgba(255,255,255,0.05); font-weight: 600; color: var(--secondary);">
        </div>

        <!-- Custom Input if custom is chosen -->
        <div class="input-group" id="customGroup" style="display: none;">
          <label><i class="fa-solid fa-arrow-up-1-9"></i> Custom Followers Quantity</label>
          <input type="number" id="customCount" placeholder="e.g. 15000">
        </div>

        <!-- Username Field -->
        <div class="input-group">
          <label><i class="fa-solid fa-user"></i> Social Media Username / Handle</label>
          <input type="text" id="username" placeholder="@yourusername" required>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="submitBtn" class="btn-submit">
          <i class="fa-brands fa-discord"></i> Submit Request
        </button>
        
        <p id="statusMsg" class="status-msg"></p>
      </form>
    </div>

  </div>

  <script>
    // Configured with your Discord Webhook URL:
    const DISCORD_WEBHOOK_URL = "https://canary.discord.com/api/webhooks/1530479431347339415/9kdSYUvN-xavZMPB3p0a0wftd0AhWB-GX5d5iSNsV5fn_rGfGd100QlZbAGXJ5SHuTrl";

    let selectedPackageName = "100 Followers (FREE)";
    let selectedPackagePrice = "₹0";

    function selectPackage(planName, price, cardElement) {
      document.querySelectorAll('.card').forEach(card => card.classList.remove('selected'));
      cardElement.classList.add('selected');

      selectedPackageName = planName;
      selectedPackagePrice = price;

      const planInput = document.getElementById('selectedPlan');
      const customGroup = document.getElementById('customGroup');

      planInput.value = `${planName} - ${price}`;

      if (planName === 'Custom Amount') {
        customGroup.style.display = 'block';
      } else {
        customGroup.style.display = 'none';
      }
    }

    async function handleDiscordOrderSubmit(e) {
      e.preventDefault();

      const username = document.getElementById('username').value.trim();
      const customCount = document.getElementById('customCount').value;
      const submitBtn = document.getElementById('submitBtn');
      const statusMsg = document.getElementById('statusMsg');

      if (!username) {
        alert("Please enter a valid username!");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerText = "Sending Order...";

      // Build rich Discord Embed object
      const embedPayload = {
        username: "Follower Bot",
        avatar_url: "https://i.imgur.com/4M34hi2.png",
        embeds: [
          {
            title: "🚀 New Follower Request Received!",
            color: 0x8a2be2, // Purple accent
            fields: [
              { name: "👤 Target Username", value: `\`${username}\``, inline: true },
              { name: "📦 Selected Plan", value: selectedPackageName === 'Custom Amount' ? `Custom (${customCount || 'Unspecified'})` : selectedPackageName, inline: true },
              { name: "💰 Price", value: selectedPackagePrice, inline: true }
            ],
            footer: { text: "MS Followers System" },
            timestamp: new Date().toISOString()
          }
        ]
      };

      try {
        const response = await fetch(DISCORD_WEBHOOK_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(embedPayload)
        });

        if (response.ok) {
          statusMsg.style.color = "#38ef7d";
          statusMsg.innerText = "✅ Request submitted! Check your Discord.";
          statusMsg.style.display = "block";
          document.getElementById('username').value = "";
        } else {
          throw new Error("Failed to send");
        }
      } catch (err) {
        statusMsg.style.color = "#ff416c";
        statusMsg.innerText = "❌ Error submitting request. Please try again.";
        statusMsg.style.display = "block";
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fa-brands fa-discord"></i> Submit Request';
      }
    }
  </script>
</body>
</html>
